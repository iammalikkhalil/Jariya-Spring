# ===============================
# Application
# ===============================
spring.application.name=Jariya
server.port=8084


# ===============================
# PostgreSQL (LOCAL ? PERMANENT)
# ===============================
spring.datasource.url=jdbc:postgresql://82.112.253.168:5432/jariya
spring.datasource.username=jariya_user


#server
spring.datasource.password=StrongPasswordHere

#local
#spring.datasource.password=StrongLocalPassword
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# HikariCP (LOCAL SAFE & FAST)
# ===============================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true


# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.open-in-view=false


# ? AFTER FIRST SUCCESSFUL RUN
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=false


# ===============================
# Actuator
# ===============================
management.health.db.enabled=true


# ===============================
# DevTools
# ===============================
spring.devtools.restart.enabled=false


# ===============================
# Logging (Clean & Useful)
# ===============================
logging.level.com.zaxxer.hikari=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.springframework.web=INFO


# ===============================
# Mail
# ===============================
spring.mail.host=smtp.titan.email
spring.mail.port=587
spring.mail.username=noreply@jariya.net
spring.mail.password=Noreply@123
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8